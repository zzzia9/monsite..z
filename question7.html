<body>

<h2>Question 7</h2>

<p>Quel domaine Zeus reçut-il lors du partage du monde ?</p>

<select id="rep">
<option>La mer</option>
<option>Les Enfers</option>
<option>Le ciel</option>
<option>La terre</option>
</select>

<br><br>

<a href="question8.html">
<button onclick="verifier()">Valider</button>
</a>

<script>

function verifier(){

let score = Number(localStorage.getItem("score"));

let rep = document.getElementById("rep").value;

if(rep === "Le ciel"){
score++;
}

localStorage.setItem("score",score);
; 
}

</script>
