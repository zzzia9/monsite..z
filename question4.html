<p>Combien de bras possédait un Hécatonchire ?</p>
<p>écrire un nombre entier (ex : 100)</p>

<input type="number" id="rep">

<br><br>


<a href="question5.html">

</a>
  
<script>

function verifier(){

let score = Number(localStorage.getItem("score"));

let rep = document.getElementById("rep").value;

if(rep == 100){
score++;
}

localStorage.setItem("score",score);
; 

}
